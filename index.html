<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scientific Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .btn { transition: transform 0.05s ease, background-color 0.15s ease; user-select: none; }
    .btn:active { transform: scale(0.95); }
    #display-current { overflow-x: auto; scrollbar-width: thin; }
    #display-current::-webkit-scrollbar { height: 4px; }
    #display-current::-webkit-scrollbar-thumb { background: #475569; border-radius: 2px; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">
  <!-- Navigation bar -->
  <nav class="w-full bg-slate-800 border-b border-slate-700 shadow-lg">
    <div class="max-w-md mx-auto flex gap-2 px-4 py-3">
      <button id="tab-calculator" data-view="calculator" class="btn flex-1 rounded-xl px-4 py-2 text-sm font-semibold bg-indigo-600 text-white">Calculator</button>
      <button id="tab-todo" data-view="todo" class="btn flex-1 rounded-xl px-4 py-2 text-sm font-semibold text-slate-400 hover:bg-slate-700">Todo List</button>
    </div>
  </nav>

  <main class="flex-1 flex items-start justify-center p-4">
  <div id="view-calculator" class="w-full max-w-md bg-slate-800 rounded-3xl shadow-2xl border border-slate-700 overflow-hidden">
    <!-- Header / Display -->
    <div class="px-5 pt-5 pb-4 bg-slate-800">
      <div class="flex items-center justify-between mb-2">
        <h1 class="text-slate-400 text-sm font-semibold tracking-wide uppercase">Scientific Calculator</h1>
        <button id="deg-rad-toggle" class="text-xs font-bold px-3 py-1 rounded-full bg-indigo-600 text-white hover:bg-indigo-500 btn">DEG</button>
      </div>
      <div class="bg-slate-900 rounded-2xl px-4 py-3 border border-slate-700">
        <div id="display-expression" class="text-slate-500 text-right text-sm h-6 truncate">&nbsp;</div>
        <div id="display-current" class="text-white text-right text-4xl font-light mt-1 whitespace-nowrap">0</div>
      </div>
    </div>

    <!-- Scientific functions grid -->
    <div class="px-5 pb-3">
      <div class="grid grid-cols-5 gap-2">
        <button data-action="sin" class="btn rounded-xl bg-teal-600 hover:bg-teal-500 text-white text-xs font-semibold py-3">sin</button>
        <button data-action="cos" class="btn rounded-xl bg-teal-600 hover:bg-teal-500 text-white text-xs font-semibold py-3">cos</button>
        <button data-action="tan" class="btn rounded-xl bg-teal-600 hover:bg-teal-500 text-white text-xs font-semibold py-3">tan</button>
        <button data-action="log" class="btn rounded-xl bg-teal-600 hover:bg-teal-500 text-white text-xs font-semibold py-3">log</button>
        <button data-action="ln" class="btn rounded-xl bg-teal-600 hover:bg-teal-500 text-white text-xs font-semibold py-3">ln</button>
        <button data-action="sqrt" class="btn rounded-xl bg-teal-600 hover:bg-teal-500 text-white text-sm font-semibold py-3">√</button>
        <button data-action="square" class="btn rounded-xl bg-teal-600 hover:bg-teal-500 text-white text-sm font-semibold py-3">x²</button>
        <button data-action="power" class="btn rounded-xl bg-teal-600 hover:bg-teal-500 text-white text-sm font-semibold py-3">x^y</button>
        <button data-action="factorial" class="btn rounded-xl bg-teal-600 hover:bg-teal-500 text-white text-sm font-semibold py-3">n!</button>
        <button data-action="percent" class="btn rounded-xl bg-teal-600 hover:bg-teal-500 text-white text-sm font-semibold py-3">%</button>
        <button data-action="pi" class="btn rounded-xl bg-teal-600 hover:bg-teal-500 text-white text-sm font-semibold py-3">π</button>
        <button data-action="e" class="btn rounded-xl bg-teal-600 hover:bg-teal-500 text-white text-sm font-semibold py-3">e</button>
        <button data-action="negate" class="btn rounded-xl bg-teal-600 hover:bg-teal-500 text-white text-sm font-semibold py-3">±</button>
        <button data-action="decimal" class="btn rounded-xl bg-teal-600 hover:bg-teal-500 text-white text-sm font-semibold py-3">.</button>
        <button data-action="clear" class="btn rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-sm font-semibold py-3">AC</button>
      </div>
    </div>

    <!-- Basic operations grid -->
    <div class="px-5 pb-5">
      <div class="grid grid-cols-4 gap-2">
        <button data-action="delete" class="btn rounded-xl bg-amber-600 hover:bg-amber-500 text-white text-sm font-semibold py-4 col-span-2">Del</button>
        <button data-action="op" data-op="*" class="btn rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-lg font-bold py-4">×</button>
        <button data-action="op" data-op="/" class="btn rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-lg font-bold py-4">÷</button>

        <button data-action="num" data-val="7" class="btn rounded-xl bg-slate-700 hover:bg-slate-600 text-white text-lg font-semibold py-4">7</button>
        <button data-action="num" data-val="8" class="btn rounded-xl bg-slate-700 hover:bg-slate-600 text-white text-lg font-semibold py-4">8</button>
        <button data-action="num" data-val="9" class="btn rounded-xl bg-slate-700 hover:bg-slate-600 text-white text-lg font-semibold py-4">9</button>
        <button data-action="op" data-op="-" class="btn rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-lg font-bold py-4">−</button>

        <button data-action="num" data-val="4" class="btn rounded-xl bg-slate-700 hover:bg-slate-600 text-white text-lg font-semibold py-4">4</button>
        <button data-action="num" data-val="5" class="btn rounded-xl bg-slate-700 hover:bg-slate-600 text-white text-lg font-semibold py-4">5</button>
        <button data-action="num" data-val="6" class="btn rounded-xl bg-slate-700 hover:bg-slate-600 text-white text-lg font-semibold py-4">6</button>
        <button data-action="op" data-op="+" class="btn rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-lg font-bold py-4">+</button>

        <button data-action="num" data-val="1" class="btn rounded-xl bg-slate-700 hover:bg-slate-600 text-white text-lg font-semibold py-4">1</button>
        <button data-action="num" data-val="2" class="btn rounded-xl bg-slate-700 hover:bg-slate-600 text-white text-lg font-semibold py-4">2</button>
        <button data-action="num" data-val="3" class="btn rounded-xl bg-slate-700 hover:bg-slate-600 text-white text-lg font-semibold py-4">3</button>
        <button data-action="equals" class="btn rounded-xl bg-emerald-500 hover:bg-emerald-400 text-white text-lg font-bold py-4 row-span-2">=</button>

        <button data-action="num" data-val="0" class="btn rounded-xl bg-slate-700 hover:bg-slate-600 text-white text-lg font-semibold py-4 col-span-3">0</button>
      </div>
    </div>
  </div>

  <!-- Todo list view -->
  <div id="view-todo" class="hidden w-full max-w-md bg-slate-800 rounded-3xl shadow-2xl border border-slate-700 overflow-hidden">
    <div class="px-5 pt-5 pb-4">
      <h1 class="text-slate-400 text-sm font-semibold tracking-wide uppercase mb-3">Todo List</h1>
      <div class="flex gap-2">
        <input id="todo-input" type="text" placeholder="What needs to be done?" autocomplete="off"
               class="flex-1 min-w-0 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm placeholder-slate-500 focus:outline-none focus:border-indigo-500" />
        <button id="todo-add" class="btn rounded-xl bg-emerald-500 hover:bg-emerald-400 text-white text-sm font-bold px-6">Add</button>
      </div>
      <p id="todo-error" class="hidden mt-3 text-rose-400 text-xs"></p>
    </div>

    <div class="px-5 pb-5">
      <ul id="todo-list" class="space-y-2"></ul>
      <p id="todo-empty" class="text-slate-500 text-sm text-center py-10">No todos yet — add one above.</p>
    </div>
  </div>
  </main>

  <script>
    (function () {
      'use strict';

      const displayCurrent = document.getElementById('display-current');
      const displayExpression = document.getElementById('display-expression');
      const degRadToggle = document.getElementById('deg-rad-toggle');
      const viewCalculator = document.getElementById('view-calculator');

      let current = '0';       // current input string
      let previous = null;     // previous operand (number)
      let operator = null;     // pending operator
      let justEvaluated = false; // true right after pressing =
      let isDegrees = true;    // DEG/RAD mode

      const OP_SYMBOLS = { '+': '+', '-': '−', '*': '×', '/': '÷' };

      function formatNumber(n) {
        if (!isFinite(n) || isNaN(n)) return 'Error';
        if (Math.abs(n) < 1e-12) n = 0; // treat tiny floats as zero
        // Limit precision but avoid scientific notation for reasonable numbers
        let str = parseFloat(n.toPrecision(12)).toString();
        return str;
      }

      function updateDisplay() {
        displayCurrent.textContent = current;
        let expr = '';
        if (previous !== null && operator) {
          expr = formatNumber(previous) + ' ' + (OP_SYMBOLS[operator] || operator);
        }
        displayExpression.textContent = expr || '\u00A0';
      }

      function inputNumber(num) {
        if (justEvaluated) {
          current = num;
          justEvaluated = false;
          return;
        }
        if (current === '0') {
          current = num;
        } else {
          current += num;
        }
      }

      function inputDecimal() {
        if (justEvaluated) {
          current = '0.';
          justEvaluated = false;
          return;
        }
        if (!current.includes('.')) {
          current += '.';
        }
      }

      function clearAll() {
        current = '0';
        previous = null;
        operator = null;
        justEvaluated = false;
      }

      function deleteLast() {
        if (justEvaluated) {
          clearAll();
          return;
        }
        if (current.length <= 1 || (current.length === 2 && current.startsWith('-'))) {
          current = '0';
        } else {
          current = current.slice(0, -1);
        }
      }

      function negate() {
        if (current === '0' || current === 'Error') return;
        if (current.startsWith('-')) {
          current = current.slice(1);
        } else {
          current = '-' + current;
        }
      }

      function toRadians(deg) { return deg * (Math.PI / 180); }

      function applyUnary(fn) {
        const val = parseFloat(current);
        if (isNaN(val)) { current = 'Error'; return; }
        let result;
        switch (fn) {
          case 'sin':
            result = Math.sin(isDegrees ? toRadians(val) : val);
            break;
          case 'cos':
            result = Math.cos(isDegrees ? toRadians(val) : val);
            break;
          case 'tan':
            result = Math.tan(isDegrees ? toRadians(val) : val);
            break;
          case 'log':
            if (val <= 0) { current = 'Error'; return; }
            result = Math.log10(val);
            break;
          case 'ln':
            if (val <= 0) { current = 'Error'; return; }
            result = Math.log(val);
            break;
          case 'sqrt':
            if (val < 0) { current = 'Error'; return; }
            result = Math.sqrt(val);
            break;
          case 'square':
            result = val * val;
            break;
          case 'factorial':
            if (val < 0 || val !== Math.floor(val) || val > 170) { current = 'Error'; return; }
            result = 1;
            for (let i = 2; i <= val; i++) result *= i;
            break;
          case 'percent':
            result = val / 100;
            break;
          default:
            return;
        }
        current = formatNumber(result);
        justEvaluated = true;
      }

      function inputConstant(c) {
        if (c === 'pi') current = formatNumber(Math.PI);
        else if (c === 'e') current = formatNumber(Math.E);
        justEvaluated = true;
      }

      function setOperator(op) {
        if (current === 'Error') return;
        const val = parseFloat(current);
        if (previous !== null && operator && !justEvaluated) {
          const res = compute(previous, val, operator);
          if (res === null) { current = 'Error'; previous = null; operator = null; return; }
          previous = res;
        } else {
          previous = val;
        }
        operator = op;
        justEvaluated = false;
        current = formatNumber(previous);
        // mark that next number replaces display
        justEvaluated = true;
      }

      function compute(a, b, op) {
        switch (op) {
          case '+': return a + b;
          case '-': return a - b;
          case '*': return a * b;
          case '/':
            if (b === 0) return null;
            return a / b;
          default: return null;
        }
      }

      function equals() {
        if (operator === null || previous === null) return;
        if (current === 'Error') return;
        const val = parseFloat(current);
        const res = compute(previous, val, operator);
        if (res === null) {
          current = 'Error';
          previous = null;
          operator = null;
          justEvaluated = true;
          return;
        }
        const exprStr = formatNumber(previous) + ' ' + (OP_SYMBOLS[operator] || operator) + ' ' + formatNumber(val) + ' =';
        current = formatNumber(res);
        previous = null;
        operator = null;
        justEvaluated = true;
        displayExpression.textContent = exprStr;
        return;
      }

      function handleAction(action, el) {
        switch (action) {
          case 'num':
            inputNumber(el.dataset.val);
            break;
          case 'decimal':
            inputDecimal();
            break;
          case 'op':
            setOperator(el.dataset.op);
            break;
          case 'equals':
            equals();
            break;
          case 'clear':
            clearAll();
            break;
          case 'delete':
            deleteLast();
            break;
          case 'negate':
            negate();
            break;
          case 'sin':
          case 'cos':
          case 'tan':
          case 'log':
          case 'ln':
          case 'sqrt':
          case 'square':
          case 'factorial':
          case 'percent':
            applyUnary(action);
            break;
          case 'pi':
          case 'e':
            inputConstant(action);
            break;
          default:
            return;
        }
        updateDisplay();
      }

      // Button click handling
      document.querySelectorAll('button[data-action]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          handleAction(btn.dataset.action, btn);
        });
      });

      // DEG/RAD toggle
      degRadToggle.addEventListener('click', function () {
        isDegrees = !isDegrees;
        degRadToggle.textContent = isDegrees ? 'DEG' : 'RAD';
      });

      // Keyboard support
      document.addEventListener('keydown', function (e) {
        // Ignore keystrokes while another view (e.g. the todo list) is showing
        if (viewCalculator.classList.contains('hidden')) return;
        const key = e.key;
        if (key >= '0' && key <= '9') {
          e.preventDefault();
          inputNumber(key);
          updateDisplay();
        } else if (key === '.') {
          e.preventDefault();
          inputDecimal();
          updateDisplay();
        } else if (key === '+' || key === '-') {
          e.preventDefault();
          setOperator(key);
          updateDisplay();
        } else if (key === '*' || key === '/') {
          e.preventDefault();
          setOperator(key);
          updateDisplay();
        } else if (key === 'Enter' || key === '=') {
          e.preventDefault();
          equals();
          updateDisplay();
        } else if (key === 'Escape') {
          e.preventDefault();
          clearAll();
          updateDisplay();
        } else if (key === 'Backspace') {
          e.preventDefault();
          deleteLast();
          updateDisplay();
        } else if (key === '%') {
          e.preventDefault();
          applyUnary('percent');
          updateDisplay();
        }
      });

      updateDisplay();
    })();

    // --- Nav bar + todo list ---
    (function () {
      'use strict';

      const API = '/api/todos';
      const views = {
        calculator: document.getElementById('view-calculator'),
        todo: document.getElementById('view-todo')
      };
      const tabs = document.querySelectorAll('nav button[data-view]');
      const input = document.getElementById('todo-input');
      const addBtn = document.getElementById('todo-add');
      const list = document.getElementById('todo-list');
      const emptyMsg = document.getElementById('todo-empty');
      const errorMsg = document.getElementById('todo-error');

      let todos = [];

      function showError(message) {
        errorMsg.textContent = message;
        errorMsg.classList.toggle('hidden', !message);
      }

      function render() {
        list.innerHTML = '';
        emptyMsg.classList.toggle('hidden', todos.length > 0);

        todos.forEach(function (todo) {
          const li = document.createElement('li');
          li.className = 'flex items-center gap-3 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3';

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = Boolean(todo.completed);
          checkbox.className = 'w-5 h-5 shrink-0 accent-emerald-500 cursor-pointer';
          checkbox.addEventListener('change', function () {
            toggleTodo(todo, checkbox.checked);
          });

          const text = document.createElement('span');
          text.textContent = todo.text;
          text.className = 'flex-1 text-sm break-words ' +
            (todo.completed ? 'line-through text-slate-500' : 'text-slate-100');

          const del = document.createElement('button');
          del.textContent = 'Delete';
          del.className = 'btn shrink-0 rounded-lg bg-rose-600 hover:bg-rose-500 text-white text-xs font-semibold px-3 py-1.5';
          del.addEventListener('click', function () { deleteTodo(todo.id); });

          li.append(checkbox, text, del);
          list.appendChild(li);
        });
      }

      async function request(url, options) {
        const res = await fetch(url, options);
        if (!res.ok) throw new Error('Request failed with status ' + res.status);
        return res.json();
      }

      async function loadTodos() {
        try {
          todos = await request(API);
          showError('');
        } catch (err) {
          todos = [];
          showError('Could not reach the server. Start it with: python3 server.py');
        }
        render();
      }

      async function addTodo() {
        const text = input.value.trim();
        if (!text) return;
        try {
          const todo = await request(API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: text })
          });
          todos.push(todo);
          input.value = '';
          showError('');
        } catch (err) {
          showError('Could not add the todo.');
        }
        render();
      }

      async function toggleTodo(todo, completed) {
        try {
          const updated = await request(API + '/' + todo.id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ completed: completed })
          });
          todos = todos.map(function (t) { return t.id === updated.id ? updated : t; });
          showError('');
        } catch (err) {
          showError('Could not update the todo.');
        }
        render();
      }

      async function deleteTodo(id) {
        try {
          await request(API + '/' + id, { method: 'DELETE' });
          todos = todos.filter(function (t) { return t.id !== id; });
          showError('');
        } catch (err) {
          showError('Could not delete the todo.');
        }
        render();
      }

      function activateView(name) {
        Object.keys(views).forEach(function (key) {
          views[key].classList.toggle('hidden', key !== name);
        });
        tabs.forEach(function (tab) {
          const active = tab.dataset.view === name;
          tab.classList.toggle('bg-indigo-600', active);
          tab.classList.toggle('text-white', active);
          tab.classList.toggle('text-slate-400', !active);
          tab.classList.toggle('hover:bg-slate-700', !active);
        });
      }

      tabs.forEach(function (tab) {
        tab.addEventListener('click', function () { activateView(tab.dataset.view); });
      });

      addBtn.addEventListener('click', addTodo);
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          addTodo();
        }
      });

      loadTodos();
    })();
  </script>
</body>
</html>
