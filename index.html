<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scientific Calculator</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --btn: #262a33;
    --btn-hover: #333844;
    --btn-op: #2d3548;
    --btn-op-hover: #3a4458;
    --btn-fn: #2a2336;
    --btn-fn-hover: #3a2f4a;
    --accent: #4a9eff;
    --accent2: #a855f7;
    --text: #e4e6eb;
    --text-dim: #8b90a0;
    --display-bg: #0b0d11;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
  }
  .calculator {
    width: 100%;
    max-width: 380px;
    background: var(--panel);
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    padding: 20px;
    border: 1px solid #222630;
  }
  .display {
    background: var(--display-bg);
    border-radius: 12px;
    padding: 18px 16px;
    margin-bottom: 16px;
    text-align: right;
    overflow: hidden;
    border: 1px solid #1e2128;
  }
  .display .expr {
    color: var(--text-dim);
    font-size: 14px;
    min-height: 18px;
    word-wrap: break-word;
    white-space: pre-wrap;
    margin-bottom: 6px;
    max-height: 60px;
    overflow-y: auto;
  }
  .display .result {
    font-size: 34px;
    font-weight: 600;
    color: var(--text);
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  .buttons {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }
  button {
    border: none;
    border-radius: 10px;
    padding: 14px 0;
    font-size: 17px;
    font-family: inherit;
    background: var(--btn);
    color: var(--text);
    cursor: pointer;
    transition: background 0.12s ease, transform 0.05s ease;
    user-select: none;
  }
  button:hover { background: var(--btn-hover); }
  button:active { transform: scale(0.95); }
  button.op { background: var(--btn-op); color: var(--accent); font-weight: 600; }
  button.op:hover { background: var(--btn-op-hover); }
  button.fn { background: var(--btn-fn); color: var(--accent2); font-size: 14px; }
  button.fn:hover { background: var(--btn-fn-hover); }
  button.eq { background: var(--accent); color: #fff; font-weight: 700; }
  button.eq:hover { background: #3a89e8; }
  button.clear { background: #3a2228; color: #ff6b6b; }
  button.clear:hover { background: #4a2830; }
  button.wide { grid-column: span 2; }
  footer {
    text-align: center;
    margin-top: 14px;
    font-size: 11px;
    color: var(--text-dim);
  }
</style>
</head>
<body>
<div class="calculator">
  <div class="display">
    <div class="expr" id="expr"></div>
    <div class="result" id="result">0</div>
  </div>
  <div class="buttons" id="keys">
    <button class="fn" data-act="fn" data-val="sin(">sin</button>
    <button class="fn" data-act="fn" data-val="cos(">cos</button>
    <button class="fn" data-act="fn" data-val="tan(">tan</button>
    <button class="fn" data-act="fn" data-val="log(">log</button>
    <button class="fn" data-act="fn" data-val="ln(">ln</button>

    <button class="fn" data-act="fn" data-val="sqrt(">√</button>
    <button class="fn" data-act="fn" data-val="^">^</button>
    <button class="fn" data-act="fn" data-val="!">!</button>
    <button class="fn" data-act="const" data-val="pi">π</button>
    <button class="fn" data-act="const" data-val="e">e</button>

    <button class="op" data-act="raw" data-val="(">(</button>
    <button class="op" data-act="raw" data-val=")">)</button>
    <button class="clear" data-act="clear">C</button>
    <button class="clear" data-act="back">⌫</button>
    <button class="op" data-act="op" data-val="/">÷</button>

    <button data-act="num" data-val="7">7</button>
    <button data-act="num" data-val="9">9</button>
    <button class="op" data-act="op" data-val="*">×</button>
    <button class="op" data-act="op" data-val="%">%</button>

    <button data-act="num" data-val="4">4</button>
    <button data-act="num" data-val="5">5</button>
    <button data-act="num" data-val="6">6</button>
    <button class="op" data-act="op" data-val="-">−</button>
    <button data-act="raw" data-val=".">.</button>

    <button data-act="num" data-val="1">1</button>
    <button data-act="num" data-val="2">2</button>
    <button data-act="num" data-val="3">3</button>
    <button class="op" data-act="op" data-val="+">+</button>
    <button class="eq" data-act="equals">=</button>

    <button class="wide" data-act="num" data-val="0">0</button>
    <button class="wide" data-act="raw" data-val="00">00</button>
    <button class="op" data-act="ans" data-val="ans">Ans</button>
  </div>
  <footer>Scientific Calculator &middot; dark theme</footer>
</div>
<script>
(function () {
  const exprEl = document.getElementById('expr');
  const resultEl = document.getElementById('result');
  let input = '';
  let lastAnswer = 0;
  let justEvaluated = false;

  function render() {
    exprEl.textContent = input || '';
    resultEl.textContent = input ? input : String(lastAnswer);
  }

  function insert(val) {
    if (justEvaluated) {
      if (!/[+\-*/^%!]/.test(val[0]) && val !== ')') {
        input = '';
      }
      justEvaluated = false;
    }
    input += val;
    render();
  }

  function clearAll() {
    input = '';
    justEvaluated = false;
    resultEl.textContent = '0';
    render();
  }

  function backspace() {
    if (justEvaluated) { input = ''; justEvaluated = false; }
    else input = input.slice(0, -1);
    render();
  }

  function factorial(n) {
    if (n < 0 || !Number.isInteger(n)) throw new Error('Factorial requires a non-negative integer');
    let r = 1;
    for (let i = 2; i <= n; i++) r *= i;
    return r;
  }

  function evaluate() {
    if (!input.trim()) return;
    let expr = input;
    expr = expr.replace(/\bpi\b/g, '(Math.PI)')
               .replace(/\be\b/g, '(Math.E)');
    expr = expr.replace(/\^/g, '**');
    expr = expr.replace(/(\d+|\)\s*)!/g, function(m) {
      if (m.endsWith(')')) return '__fact(' + m.slice(0, -1) + ')';
      return '__fact(' + m.slice(0, -1) + ')';
    });
    expr = expr.replace(/\blog\(/g, 'Math.log10(')
               .replace(/\bln\(/g, 'Math.log(')
               .replace(/\bsqrt\(/g, 'Math.sqrt(')
               .replace(/\bsin\(/g, 'Math.sin(Math.PI/180*(')
               .replace(/\bcos\(/g, 'Math.cos(Math.PI/180*(')
               .replace(/\btan\(/g, 'Math.tan(Math.PI/180*(');
    expr = expr.replace(/__fact/g, 'fact');
    expr = expr.replace(/%/g, '/100');
    try {
      const fact = factorial;
      const fn = new Function('fact', 'return (' + expr + ');');
      const val = fn(fact);
      if (typeof val !== 'number' || !isFinite(val)) {
        resultEl.textContent = 'Error';
        return;
      }
      lastAnswer = val;
      exprEl.textContent = input + ' =';
      resultEl.textContent = String(val);
      input = String(val);
      justEvaluated = true;
    } catch (e) {
      resultEl.textContent = 'Error';
      justEvaluated = false;
    }
  }

  document.getElementById('keys').addEventListener('click', function (e) {
    const btn = e.target.closest('button');
    if (!btn) return;
    const act = btn.dataset.act;
    const val = btn.dataset.val || '';
    switch (act) {
      case 'num':
      case 'fn':
      case 'raw':
      case 'op':
      case 'const':
        insert(val);
        break;
      case 'clear':
        clearAll();
        break;
      case 'back':
        backspace();
        break;
      case 'equals':
        evaluate();
        break;
      case 'ans':
        insert(String(lastAnswer));
        break;
    }
  });

  document.addEventListener('keydown', function (e) {
    const k = e.key;
    if (/[0-9]/.test(k)) { insert(k); }
    else if (k === '.') { insert('.'); }
    else if (k === '+' || k === '-' || k === '*' || k === '/' || k === '%' || k === '^' || k === '!') { insert(k); }
    else if (k === '(' || k === ')') { insert(k); }
    else if (k === 'Enter' || k === '=') { e.preventDefault(); evaluate(); }
    else if (k === 'Backspace') { backspace(); }
    else if (k === 'Escape') { clearAll(); }
  });

  render();
})();
</script>
</body>
</html>
